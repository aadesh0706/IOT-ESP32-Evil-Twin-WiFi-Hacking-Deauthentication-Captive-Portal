<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800">
  <style>
    .box { fill:#f8f9fa; stroke:#333; stroke-width:2; rx:8; }
    .arrow { stroke:#333; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
    .label { font-family: Arial, Helvetica, sans-serif; font-size:14px; fill:#111; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- boxes -->
  <rect x="360" y="20" width="280" height="50" class="box"/>
  <text x="500" y="50" text-anchor="middle" class="label">Start device</text>

  <rect x="360" y="110" width="280" height="50" class="box"/>
  <text x="500" y="140" text-anchor="middle" class="label">Perform WiFi scan</text>

  <rect x="360" y="200" width="280" height="50" class="box"/>
  <text x="500" y="230" text-anchor="middle" class="label">Select target AP</text>

  <rect x="360" y="290" width="280" height="50" class="box"/>
  <text x="500" y="320" text-anchor="middle" class="label">Start deauth loop</text>

  <rect x="360" y="380" width="280" height="50" class="box"/>
  <text x="500" y="410" text-anchor="middle" class="label">Start EvilTwin softAP</text>

  <rect x="360" y="470" width="280" height="50" class="box"/>
  <text x="500" y="500" text-anchor="middle" class="label">DNS -> captive portal</text>

  <rect x="200" y="560" width="220" height="50" class="box"/>
  <text x="310" y="590" text-anchor="middle" class="label">Client connects</text>

  <rect x="540" y="560" width="220" height="50" class="box"/>
  <text x="650" y="590" text-anchor="middle" class="label">Serve portal page</text>

  <rect x="360" y="660" width="280" height="50" class="box"/>
  <text x="500" y="690" text-anchor="middle" class="label">User submits password</text>

  <!-- arrows -->
  <path d="M500 70 L500 110" class="arrow" />
  <path d="M500 160 L500 200" class="arrow" />
  <path d="M500 250 L500 290" class="arrow" />
  <path d="M500 340 L500 380" class="arrow" />
  <path d="M500 430 L500 470" class="arrow" />
  <path d="M440 520 L300 560" class="arrow" />
  <path d="M560 520 L700 560" class="arrow" />
  <path d="M310 610 L500 660" class="arrow" />
  <path d="M700 610 L560 660" class="arrow" />

  <!-- end -->
  <rect x="360" y="740" width="280" height="30" class="box"/>
  <text x="500" y="760" text-anchor="middle" class="label">End / Save Result</text>
</svg>