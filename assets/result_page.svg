<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <style>
    .bg { fill:#f8fafc }
    .card { fill:#fff; stroke:#c7d2fe }
    .ok { font-family: Arial, sans-serif; font-size:20px; fill:#065f46 }
