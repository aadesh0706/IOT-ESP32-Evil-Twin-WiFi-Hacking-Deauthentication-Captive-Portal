  </style>
  <rect width="100%" height="100%" class="bg"/>
  <rect x="40" y="30" width="820" height="180" class="card" rx="8"/>
  <text x="80" y="90" class="ok">Success — Connected to target AP</text>
  <text x="80" y="130" class="ok">Captured password: •••••••• (example)</text>
  <text x="80" y="170" class="ok">EvilTwin stopped; DNS restored.</text>
</svg>